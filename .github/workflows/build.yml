name: Build desktop artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller packaging\pyinstaller_windows.spec --noconfirm --clean

      - name: Package exe
        shell: pwsh
        run: Compress-Archive -Path "dist\MIDI Hype.exe" -DestinationPath "dist\MIDI-Hype-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Hype-Windows
          path: dist/MIDI-Hype-Windows.zip

  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller packaging/pyinstaller_macos.spec --noconfirm --clean

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MIDI Hype.app" "dist/MIDI-Hype-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Hype-macOS
          path: dist/MIDI-Hype-macOS.zip

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*.zip
          generate_release_notes: true

